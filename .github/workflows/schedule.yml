name: 月次レポート自動送信

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Chromeをセットアップ
        uses: browser-actions/setup-chrome@latest

      - name: 必要なライブラリをインストール
        run: |
          pip install selenium requests google-auth google-auth-httplib2 google-api-python-client

      - name: ChromeDriverをインストール
        run: |
          pip install webdriver-manager

      - name: レポートをダウンロードしてLINEに送信
        env:
          SHOPSERVE_ID: ${{ secrets.SHOPSERVE_ID }}
          SHOPSERVE_PASS: ${{ secrets.SHOPSERVE_PASS }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python main.py
