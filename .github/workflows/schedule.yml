name: 月次レポート自動送信

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Chromeをセットアップ
        uses: browser-actions/setup-chrome@latest

      - name: 必要なライブラリをインストール
        run: |
          pip install selenium requests dropbox google-auth google-auth-httplib2 google-api-python-client

      - name: ChromeDriverをインストール
        run: |
          pip install webdriver-manager

      - name: レポートをダウンロードしてLINEに送信
        env:
          SHOPSERVE_ID: ${{ secrets.SHOPSERVE_ID }}
          SHOPSERVE_PASS: ${{ secrets.SHOPSERVE_PASS }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
      python -c "
      import requests, os
      LINE_ACCESS_TOKEN = os.environ['LINE_ACCESS_TOKEN']
      LINE_USER_ID = os.environ['LINE_USER_ID']
      url = 'https://api.line.me/v2/bot/message/push'
      headers = {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + LINE_ACCESS_TOKEN}
      payload = {'to': LINE_USER_ID, 'messages': [{'type': 'text', 'text': 'テスト'}]}
      print('送信先ID:', LINE_USER_ID)
      print('ID文字数:', len(LINE_USER_ID))
      resp = requests.post(url, headers=headers, json=payload)
      print('ステータス:', resp.status_code)
      print('レスポンス全文:', resp.text)
      "
